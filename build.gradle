plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.fabricmc.fabric-loom' version '1.17.17'
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

repositories {
    mavenLocal()
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Fuzs Mod Resources'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Dynamic Trees (fabric artifact bundles the common classes)
    implementation "com.dtteam.dynamictrees:dynamictrees-fabric-${minecraft_version}:${dynamic_trees_version}"

    // Forge Config API Port (config registration on Fabric)
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}"
}

processResources {
    var expandProps = [
            'mod_version'          : mod_version,
            'minecraft_version'    : minecraft_version,
            'fabric_loader_version': fabric_loader_version,
            'mod_name'             : mod_name,
            'mod_authors'          : mod_authors,
            'mod_id'               : mod_id,
            'mod_license'          : mod_license,
            'mod_credits'          : mod_credits,
            'mod_description'      : mod_description,
            'java_version'         : java_version
    ]

    filesMatching(['pack.mcmeta', 'fabric.mod.json']) {
        expand expandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
